schema: 2
package: SynoPkgNavidrome
version: 0.64.2
build: 17
displayname: Navidrome
description: Stream your music collection through a web player or compatible apps
maintainer: Navidrome
metadata:
  changelog: {"en": "Install wizard: port conflicts only warn; shared folder selection fixed", "zh-TW": "安裝精靈：連接埠衝突僅顯示警告；修正共享資料夾選取", "zh-CN": "安装向导：端口冲突仅显示警告；修复共享文件夹选择", "ja": "インストールウィザード：ポートの競合は警告のみ表示し、共有フォルダーの選択を修正", "ko": "설치 마법사: 포트 충돌은 경고만 표시하며 공유 폴더 선택 문제 수정", "de": "Installationsassistent: Portkonflikte zeigen nur eine Warnung an; Auswahl freigegebener Ordner korrigiert", "fr": "Assistant d’installation : les conflits de ports affichent un avertissement ; sélection du dossier partagé corrigée"}
  maintainer_url: https://github.com/navidrome/navidrome
  distributor: Syno Package Land
  distributor_url: https://synopkgland.com/
icon: assets/navidrome.png
os_min_ver: "7.2.1-69057"
arches: [x86_64]
entry: app-privilege
capabilities: {composeMounts: true}
install:
  sharedFolder: {mode: dedicated, key: music, name: Navidrome, permission: ro}
compose:
  sdk: 0.46.1
  files: [compose.yaml]
  helpers: {x86_64: .build/helpers}
  shares:
    music:
      select: install
      mounts: [{service: navidrome, target: /music}]
  services:
    navidrome:
      storage_init:
        directories: [{base: /var/tmp, path: navidrome}]
        runtime:
          environment:
            BRIDGE_CONTROL: {secret: bridge-control}
  web: {service: navidrome, port: 4533, health: {path: /ping, status: 200}}
  network: {egress: internet}
identity_gateway:
  upstream_auth_paths: [/rest, /share]
  sdk: 0.46.1
  mode: header
  access: dsm-users
  ingress: {path: /synopkgland/SynoPkgNavidrome/}
  session_ttl: 900
  headers: {user: Remote-User, uid: Remote-Uid, groups: Remote-Groups}
  roles: {admin: admin, user: user}
  passthrough: [/rest, /share]
  account:
    on_delete:
      - exec: [account-delete, delete, /var/packages/SynoPkgNavidrome/target, "{uid}"]
ui: {launch: new-page}
i18n:
  info:
    zh-TW:
      description: 透過網頁播放器或相容 App 串流播放你的音樂收藏
