schema: 2
package: SynoPkgNavidrome
version: 0.64.2
build: 20
displayname: Navidrome
description: Stream your music collection through a web player or compatible apps
maintainer: Navidrome
metadata:
  changelog: {"en": "Select a media folder at any depth within a shared folder", "zh-TW": "可選取共享資料夾內任意層級的媒體資料夾", "zh-CN": "可选择共享文件夹内任意层级的媒体文件夹", "ja": "共有フォルダー内の任意の階層にあるメディアフォルダーを選択", "ko": "공유 폴더 내 모든 깊이의 미디어 폴더 선택 지원", "de": "Medienordner auf jeder Ebene eines freigegebenen Ordners auswählen", "fr": "Choisir un dossier multimédia à toute profondeur dans un dossier partagé", "es": "Seleccionar una carpeta multimedia a cualquier nivel dentro de una carpeta compartida", "it": "Seleziona una cartella multimediale a qualsiasi livello in una cartella condivisa"}
  maintainer_url: https://github.com/navidrome/navidrome
  distributor: Syno Package Land
  distributor_url: https://synopkgland.com/
icon: assets/navidrome.png
os_min_ver: "7.2.1-69057"
arches: [x86_64]
entry: app-privilege
capabilities: {composeMounts: true}
install:
  sharedFolder: {mode: select, key: music, permission: ro, picker: folder}
compose:
  sdk: 0.53.23
  files: [compose.yaml]
  helpers: {x86_64: .build/helpers}
  shares:
    music:
      select: install
      picker: folder
      permission: ro
      mounts: [{service: navidrome, target: /music}]
  services:
    navidrome:
      storage_init:
        directories: [{base: /var/tmp, path: navidrome}]
        runtime:
          environment:
            BRIDGE_CONTROL: {secret: bridge-control}
  web: {service: navidrome, port: 4533, health: {path: /ping, status: 200}}
  network: {egress: internet}
identity_gateway:
  upstream_auth_paths: [/rest, /share]
  sdk: 0.53.23
  mode: header
  access: dsm-users
  ingress: {path: /synopkgland/SynoPkgNavidrome/}
  session_ttl: 900
  headers: {user: Remote-User, uid: Remote-Uid, groups: Remote-Groups}
  roles: {admin: admin, user: user}
  passthrough: [/rest, /share]
  account:
    on_delete:
      - exec: [account-delete, delete, /var/packages/SynoPkgNavidrome/target, "{uid}"]
ui: {launch: new-page}
i18n:
  info:
    zh-TW:
      description: 透過網頁播放器或相容 App 串流播放你的音樂收藏
